<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Series Search App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <h1 class="logo">🎬 TV Series Hub</h1>
  <p class="tagline">Discover your favorite TV shows</p>
</header>

<!-- MAIN CONTENT -->
<main class="main">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search TV series..." onkeyup="searchSeries()">
  </div>

  <section class="series-container" id="seriesContainer">
    <!-- Cards added by JS -->
  </section>
</main>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2025 TV Series Hub | Built with HTML, CSS & JavaScript</p>
</footer>

<script src="script.js"></script>
</body>
</html>
