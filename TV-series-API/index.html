<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Series Search App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER / HERO -->
  <header class="hero">
    <h1 class="title">🎬 TV Series Search App</h1>
    <p class="subtitle">Search IMDb-style TV series details</p>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Enter TV series name..."
      >
      <button onclick="searchSeries()">Search</button>
    </div>

    <p id="message"></p>
  </header>

  <!-- RESULT SECTION -->
  <main>
    <div id="seriesContainer"></div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 TV Series App | HTML • CSS • JavaScript • OMDb API</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
