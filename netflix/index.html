<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StreamX | OTT Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">StreamX</div>

  <nav class="nav">
    <a href="#">Contact</a>
    <a href="#" class="signup">Sign Up</a>
    <a href="#" class="login">Login</a>
    <input type="text" id="searchInput" class="search-input" placeholder="Search series">
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Unlimited Movies & Series</h1>
    <p>Watch anywhere. Cancel anytime.</p>
    <button class="cta">Get Started</button>
  </div>
</section>

<!-- MOVIES -->
<section class="movies">
  <h2 class="section-title">Trending Now</h2>
  <div class="row">
    <div class="card"><img src="https://image.tmdb.org/t/p/w500/jRXYjXNq0Cs2TcJjLkki24MLp7u.jpg"></div>
    <div class="card"><img src="https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg"></div>
    <div class="card"><img src="https://image.tmdb.org/t/p/w500/lNyLSOKMMeUPr1RsL4KcRuIXwHt.jpg"></div>
  </div>

  <h2 class="section-title">Popular Shows</h2>
  <div class="row">
    <div class="card"><img src="https://image.tmdb.org/t/p/w500/x2LSRK2Cm7MZhjluni1msVJ3wDF.jpg"></div>
    <div class="card"><img src="https://image.tmdb.org/t/p/w500/reEMJA1uzscCbkpeRJeTT2bjqUp.jpg"></div>
    <div class="card"><img src="https://image.tmdb.org/t/p/w500/uKvVjHNqB5VmOrdxqAt2F7J78ED.jpg"></div>
  </div>
</section>

<!-- SEARCH RESULT -->
<section class="search-result">
  <p id="message" class="message"></p>
  <div id="seriesContainer"></div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <p class="footer-call">Questions? Call <span>000-800-919-1743</span></p>

  <div class="footer-links">
    <ul>
      <li><a href="#">FAQ</a></li>
      <li><a href="#">Privacy</a></li>
      <li><a href="#">Speed Test</a></li>
    </ul>
    <ul>
      <li><a href="#">Help Centre</a></li>
      <li><a href="#">Jobs</a></li>
      <li><a href="#">Cookie Preferences</a></li>
    </ul>
    <ul>
      <li><a href="#">Account</a></li>
      <li><a href="#">Ways to Watch</a></li>
    </ul>
  </div>

  <p class="footer-brand">StreamX India</p>
</footer>

<script src="script.js"></script>
</body>
</html>
